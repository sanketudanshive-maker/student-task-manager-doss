apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: student-task-manager-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: student-task-manager

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
